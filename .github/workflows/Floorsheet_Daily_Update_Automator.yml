name: NEPSE Daily Floorsheet Scraper

on:
  schedule:
    # 11:15 UTC is 17:00 NPT. Runs Monday (1) through Friday (5)
    - cron: '15 11 * * 1-5'
  workflow_dispatch: # Retains the button to run it manually from the UI anytime

jobs:
  scrape-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary python-dotenv

      - name: Run Floorsheet Scraper
        env:
          DB_URI: ${{ secrets.DB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipelines/Floorsheet_Daily_Update.py
