name: NEPSE Floorsheet Audit & Verifier

on:
  schedule:
    # 08:35 UTC is 14:20 NPT (2:20 PM Nepal Time). Runs every Saturday (day 6)
    - cron: '35 8 * * 6'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Stock Symbol to verify (Optional, e.g. SHIVM, SONA). Leave blank for ALL market.'
        required: false
        default: ''
        type: string
      pages:
        description: 'Number of 500-item pages to sample for micro verification (Default: 5 = 2,500 trades)'
        required: false
        default: '5'
        type: string

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Floorsheet Verification & Telegram Audit
        env:
          DB_URI: ${{ secrets.DB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.symbol }}" ]; then
            python verify.py --symbol "${{ inputs.symbol }}" --pages "${{ inputs.pages || '5' }}"
          else
            python verify.py --pages "${{ inputs.pages || '5' }}"
          fi
