name: NEPSE Floorsheet Backfill & Gap Filler

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD) [Required]'
        required: true
        type: string
      end_date:
        description: 'End Date (YYYY-MM-DD) [Required]'
        required: true
        type: string
      symbols:
        description: 'Symbols (Comma-separated e.g. AKJCL, NHPC). Leave blank for ALL market data.'
        required: false
        default: ''
        type: string

jobs:
  backfill-floorsheet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary python-dotenv

      - name: Execute Floorsheet Filler
        env:
          DB_URI: ${{ secrets.DB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
        run: |
          python Floorsheet_Filler.py
